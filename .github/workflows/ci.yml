name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest already ships Google Chrome; Selenium Manager (bundled with
      # Selenium 4.6+) resolves a matching chromedriver automatically, so no extra
      # setup step is needed here.

      # Runs unit tests, integration tests, AND the Selenium system tests:
      # `verify` starts the app headlessly, runs the system-tagged tests against it,
      # then stops the app again (see pom.xml). Nothing opens a visible browser.
      - name: Run full test suite (unit, integration, system)
        run: mvn -B clean verify

      - name: Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test results
          path: 'target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml'
          reporter: java-junit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload surefire/failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload Selenium failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: target/selenium-screenshots/
          if-no-files-found: ignore
