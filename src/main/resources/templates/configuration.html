<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'SAT-MC | Mission Control'">SAT-MC | Mission Control</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div th:replace="~{fragments :: topbar(${active})}"></div>
<main class="container">
    <div class="page-header"><div><div class="eyebrow">Configuration</div><h1>Telemetry thresholds</h1><p class="page-subtitle">Tune the validation boundaries used to evaluate incoming telemetry.</p></div></div>
    <section class="card">
        <div class="muted-box" style="margin-bottom:18px"><div class="kpi">Satellite<strong th:text="${satellite.code + ' — ' + satellite.name}">SAT-001</strong></div></div>
        <form method="post" th:action="@{/configuration/{id}(id=${satellite.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="formgrid">
                <div class="field"><label>Telemetry interval (5–300 s)</label><input class="input" type="number" step="0.01" name="interval" th:value="${config.telemetryIntervalSeconds}" required></div>
                <div class="field"><label>Temperature minimum (°C)</label><input class="input" type="number" step="0.1" name="tempMin" th:value="${config.temperatureMin}" required></div>
                <div class="field"><label>Temperature maximum (°C)</label><input class="input" type="number" step="0.1" name="tempMax" th:value="${config.temperatureMax}" required></div>
                <div class="field"><label>Battery minimum (V)</label><input class="input" type="number" step="0.1" name="batteryMin" th:value="${config.batteryMin}" required></div>
                <div class="field"><label>Battery maximum (V)</label><input class="input" type="number" step="0.1" name="batteryMax" th:value="${config.batteryMax}" required></div>
                <div class="field"><label>Signal minimum (dBm)</label><input class="input" type="number" step="0.1" name="signalMin" th:value="${config.signalMin}" required></div>
                <div class="field"><label>Packet-loss maximum (%)</label><input class="input" type="number" step="0.1" name="packetLossMax" th:value="${config.packetLossMax}" required></div>
            </div>
            <div class="actions" style="margin-top:18px"><button class="btn" type="submit">Save configuration</button><a class="btn secondary" th:href="@{/satellites/{id}(id=${satellite.id})}">Cancel</a></div>
        </form>
    </section>
</main></body></html>
